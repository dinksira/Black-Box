<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Black Box</title>
</head>
<body class="bb-root">
  <div class="bb-shell">
    <header class="bb-topbar">
      <div class="bb-topbar__title">BLACK BOX</div>
      <div class="bb-topbar__level">
        <span id="level-name">Level 1 · AND Gate</span>
      </div>
      <div class="bb-topbar__meta">
        <span id="attempts">0 / 5</span>
        <span class="bb-dot"></span>
        <span id="timer">00:00</span>
      </div>
    </header>

    <main class="bb-main">
      <section class="bb-panel bb-panel--io">
        <div class="bb-input">
          <h2 class="bb-panel__title">INPUT</h2>
          <div class="bb-input-grid" role="grid" aria-label="Input grid">
            <button class="bb-btn" role="gridcell">0</button>
            <button class="bb-btn" role="gridcell">1</button>
            <button class="bb-btn" role="gridcell">2</button>
            <button class="bb-btn" role="gridcell">3</button>
          </div>
        </div>
        <div class="bb-output">
          <h2 class="bb-panel__title">OUTPUT</h2>
          <div id="output-slot" class="bb-output-slot" aria-live="polite">
            <span class="bb-output-slot__value">?</span>
            <span class="bb-output-slot__hint">Awaiting attempt</span>
          </div>
          <button id="submit-attempt" class="bb-btn bb-btn--primary">
            Test Input (Enter)
          </button>
        </div>
      </section>

      <section class="bb-panel bb-panel--history">
        <h2 class="bb-panel__title">HISTORY</h2>
        <table class="bb-table" aria-label="Attempt history">
          <thead>
            <tr>
              <th>#</th>
              <th>Input</th>
              <th>Output</th>
            </tr>
          </thead>
          <tbody id="history-body"></tbody>
        </table>
      </section>

      <section class="bb-panel bb-panel--hypothesis">
        <h2 class="bb-panel__title">HYPOTHESIS</h2>
        <div class="bb-hypo-row">
          <select id="hypo-category" class="bb-select">
            <option value="">Rule type…</option>
            <option value="boolean">Boolean logic</option>
            <option value="arithmetic">Arithmetic</option>
            <option value="stateful">Stateful</option>
            <option value="pattern">Pattern</option>
          </select>
          <select id="hypo-template" class="bb-select">
            <option value="">Specific rule…</option>
          </select>
          <input id="hypo-param-1" class="bb-input-field" type="number" placeholder="k" />
          <input id="hypo-param-2" class="bb-input-field" type="number" placeholder="n" />
          <button id="submit-hypo" class="bb-btn bb-btn--primary">
            Submit Hypothesis (Ctrl+Enter)
          </button>
        </div>
      </section>
    </main>

    <script src="./index.js"></script>
  </div>
</body>
</html>
